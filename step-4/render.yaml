databases:
  - name: familytask-db
    plan: free

services:
  - type: web
    name: familytask-backend
    runtime: python
    plan: free
    rootDir: step-4/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

  - type: web
    name: familytask-frontend
    runtime: static
    rootDir: step-4/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://familytask-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html