# Render lit ce fichier et crée les 3 services (base, back, front) gratuitement.
databases:
  - name: familytask-db
    plan: free

services:
  - type: web
    name: familytask-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

  - type: web
    name: familytask-front
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA : toutes les URLs (/taches, /famille…) renvoient vers index.html,
    # sinon rafraîchir une page autre que l'accueil donne une erreur 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: familytask-api
          property: host
